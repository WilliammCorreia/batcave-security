<!DOCTYPE html>
<html lang="fr-FR">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Contrôle d'Accès - Batcave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #212529; color: #fff; padding: 40px; }
      .card { max-width: 420px; margin: auto; background-color: #2c3034; }
      .card a.btn { margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="card p-4 text-light text-center">
      <h1 class="h3 mb-2">🦇 Système central</h1>
      <p class="text-secondary">
        Une authentification externe via un partenaire de confiance est requise.
      </p>

      <a href="/api/auth/login/google" class="btn btn-light w-100">Se connecter avec Google</a>
      <a href="/api/auth/login/github" class="btn btn-dark border w-100">Se connecter avec GitHub</a>
      <a href="/api/auth/login/facebook" class="btn btn-primary w-100">Se connecter avec Facebook</a>

      <hr class="my-3" />
      <p class="text-secondary small mb-0">
        Ou utilisez la <a href="/auth/login">connexion classique (mot de passe + 2FA)</a>.
      </p>
    </div>
  </body>
</html>
